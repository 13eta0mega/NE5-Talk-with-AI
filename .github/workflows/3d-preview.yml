name: Verify 3D companion preview
on:
  pull_request:
    paths:
      - 'src/renderer/three/**'
      - 'src/renderer/main.tsx'
      - 'tests/lowPolyRig.test.ts'
      - 'scripts/verify-3d.mjs'
      - '.github/workflows/3d-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build:web
      - name: Install browser-only verification tools
        run: npm install --no-save --package-lock=false @playwright/test@1.57.0 && npx playwright install --with-deps chromium
      - name: Exercise built 3D UI with WebGL and software fallback
        run: node scripts/verify-3d.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-3d-review
          path: |
            artifacts/3d
            dist
