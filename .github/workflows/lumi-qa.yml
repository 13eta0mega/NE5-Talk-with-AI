name: Lumi character QA

on:
  push:
    branches: [feat/lumi-starlight-companion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Browser motion and application regression tests
        run: |
          mkdir -p artifacts/lumi
          npm run dev > artifacts/lumi/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:5173', timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Vite did not start')
          PY
          python tests/lumi.browser.py --browsers chromium firefox webkit
      - name: Save browser screenshots and assertion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-browser-review
          path: artifacts/lumi
          retention-days: 7
