name: Moru visual and interaction QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moru-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Verify rendered motion and application
        run: |
          mkdir -p artifacts/moru
          npm run dev > artifacts/moru/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:5173', timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Vite did not start')
          PY
          python tests/moru.browser.py --browsers chromium firefox webkit > artifacts/moru/browser.log 2>&1 || { cat artifacts/moru/browser.log; exit 1; }
          cat artifacts/moru/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moru-browser-review
          path: artifacts/moru
          retention-days: 7
