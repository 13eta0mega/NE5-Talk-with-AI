<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">pet-bear-tan</title><desc id="desc">Layered semantic SVG redrawn from Pet_2.png; head, face, limbs and ornaments are independently animatable.</desc>
  <defs>
    <radialGradient id="skin" cx="43%" cy="35%" r="72%"><stop stop-color="#FBE2CB"/><stop offset=".68" stop-color="#ECC5A5"/><stop offset="1" stop-color="#ECC5A5"/></radialGradient>
