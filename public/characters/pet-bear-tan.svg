    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".2"/></filter>
    <style>#pet-root{transform-origin:500px 530px;animation:idle 3.2s ease-in-out infinite}#eye-left,#eye-right{transform-box:fill-box;transform-origin:center;animation:blink 4.8s ease-in-out infinite}#ornament-left{transform-origin:380px 240px;animation:wobble 3.2s ease-in-out infinite}#ornament-right{transform-origin:620px 240px;animation:wobbleR 3.2s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-7px) rotate(.7deg)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}@keyframes wobble{50%{transform:rotate(2.5deg)}}@keyframes wobbleR{50%{transform:rotate(-2.5deg)}}</style>
  </defs>
