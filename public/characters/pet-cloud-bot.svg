<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">pet-cloud-bot</title><desc id="desc">Layered semantic SVG redrawn from ANIMATION_PIPELINE_GUIDE.md; head, face, limbs and ornaments are independently animatable.</desc>
