      <g id="face" fill="#123A55" stroke="none"><ellipse id="eye-left" cx="395" cy="574" rx="28" ry="14"/><ellipse id="eye-right" cx="605" cy="574" rx="28" ry="14"/><circle cx="388" cy="566" r="5" fill="#fff" stroke="none" opacity=".82"/><circle cx="598" cy="566" r="5" fill="#fff" stroke="none" opacity=".82"/><ellipse id="cheek-left" cx="346" cy="642" rx="34" ry="15" fill="#F486A8" opacity="0"/><ellipse id="cheek-right" cx="654" cy="642" rx="34" ry="15" fill="#F486A8" opacity="0"/><path id="mouth" d="M453.6 618.152C477.728 628.4 522.272 628.4 546.4 618.152C523.2 634.4 476.8 634.4 453.6 618.152Z"/><g id="brow-left"/><g id="brow-right"/></g>
