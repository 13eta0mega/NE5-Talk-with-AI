<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">pet-screen-bot</title><desc id="desc">Layered semantic SVG redrawn from robot.json; head, face, limbs and ornaments are independently animatable.</desc>
  <defs>
